<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No <title> or description here on purpose: every page renders its own via React 19
      (PageMeta / page components), and a static copy here would duplicate them.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B1F3A" />
    <!--
      Theme pre-mount script: applies the dark class BEFORE React loads, so dark-mode users
      never see a white flash. It only reads localStorage and sets a class.
      Must stay in sync with client/src/providers/ThemeProvider.tsx (key "accentra-theme").
      Phase 26 (CSP): allow this script by its sha256 hash.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('accentra-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
