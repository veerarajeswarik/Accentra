<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accentra — your smart accounting partner." />
    <title>Accentra</title>
    <!--
      Theme pre-mount script: applies the dark class BEFORE React loads, so dark-mode users
      never see a white flash. It only reads localStorage and sets a class.
      Must stay in sync with client/src/providers/ThemeProvider.tsx (key "accentra-theme").
      Phase 26 (CSP): allow this script by its sha256 hash.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('accentra-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
